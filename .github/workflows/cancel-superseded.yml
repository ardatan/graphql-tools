name: Cancel superseded runs

# `concurrency.cancel-in-progress` often fails to drop runs stuck in the
# account-level job queue. On each PR synchronize, cancel older runs that belong
# to this PR, never the current head's runs.

# pull_request_target: metadata-only (no checkout of PR code) so fork PRs get a
# token that can cancel workflow runs. The script uses only the Actions/PR APIs.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: cancel-superseded-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: write
  pull-requests: read

jobs:
  cancel:
    name: Cancel older runs on this PR
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel superseded workflow runs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const keepSha = context.payload.pull_request.head.sha;

            const thisRun = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: context.runId,
            });
            const cutoffMs = Date.parse(thisRun.data.created_at);

            async function prHeadStillCurrent() {
              const fresh = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              return fresh.data.head.sha === keepSha;
            }

            // pull_request workflow runs use the merge commit as head_sha, so do
            // not match against branch tip SHAs. Prefer the run's PR association
            // (survives force-push); fall back to head repo + branch only when
            // GitHub omits pull_requests.
            function isSupersededRunForThisPr(run) {
              if (run.id === context.runId) return false;
              if (!(Date.parse(run.created_at) < cutoffMs)) return false;

              const prs = run.pull_requests || [];
              const prHit = prs.find(pr => pr.number === prNumber);
              if (prHit) {
                // Current head's runs — keep them.
                if (prHit.head?.sha === keepSha) return false;
                return true;
              }
              // Different PR, or pull_requests omitted (cannot safely claim identity).
              return false;
            }

            if (!(await prHeadStillCurrent())) {
              core.info('PR head already advanced; skipping cleanup');
              return;
            }

            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner,
              repo,
              per_page: 100,
            });

            let cancelled = 0;
            for (const workflow of workflows) {
              if (!workflow.path?.startsWith('.github/workflows/')) continue;
              if (workflow.path.endsWith('cancel-superseded.yml')) continue;

              const seen = new Set();
              for (const status of ['queued', 'in_progress', 'pending', 'waiting']) {
                if (!(await prHeadStillCurrent())) {
                  core.info('PR head advanced mid-cleanup; stopping');
                  core.info(`Cancelled ${cancelled} superseded run(s) before stop`);
                  return;
                }

                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner,
                  repo,
                  workflow_id: workflow.id,
                  event: 'pull_request',
                  status,
                  per_page: 30,
                });

                for (const run of runs) {
                  if (seen.has(run.id)) continue;
                  seen.add(run.id);
                  if (!isSupersededRunForThisPr(run)) continue;

                  try {
                    await github.rest.actions.forceCancelWorkflowRun({
                      owner,
                      repo,
                      run_id: run.id,
                    });
                    cancelled += 1;
                    core.info(
                      `force-cancelled ${workflow.name}#${run.id} (${run.head_sha.slice(0, 8)})`,
                    );
                  } catch (forceErr) {
                    try {
                      await github.rest.actions.cancelWorkflowRun({
                        owner,
                        repo,
                        run_id: run.id,
                      });
                      cancelled += 1;
                      core.info(`cancelled ${workflow.name}#${run.id} (${run.head_sha.slice(0, 8)})`);
                    } catch (cancelErr) {
                      core.warning(
                        `skip ${workflow.name}#${run.id}: ${cancelErr.message || forceErr.message}`,
                      );
                    }
                  }
                }
              }
            }
            core.info(`Cancelled ${cancelled} superseded run(s) for PR #${prNumber}`);
