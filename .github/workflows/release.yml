name: release

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - 'website/**'

concurrency:
  # Cancel superseded PR snapshot runs, but never interrupt a master publish mid-flight.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions: write-all

jobs:
  stable:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    if: github.ref == 'refs/heads/master'
    # Temporary: CLI v3 publish parsing for aggregate GitHub releases until
    # the-guild-org/shared-config#757 (stable) / #755 (snapshot) merge to v1.
    uses: ardatan/shared-config/.github/workflows/release-stable.yml@ea2edad4cafc039fde19d0c5705cd8db338d9c23
    with:
      releaseScript: run release
      versionScript: run version
      node-version-file: .node-version
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
      npmToken: ${{ secrets.NODE_AUTH_TOKEN }}

  dependencies:
    uses: the-guild-org/shared-config/.github/workflows/changesets-dependencies.yml@v1
    if:
      ${{ github.event.pull_request.title != 'Upcoming Release Changes' && github.base_ref ==
      'master' }}
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}

  alpha:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if:
      ${{ github.event.pull_request.head.repo.fork != true && github.event.pull_request.title !=
      'Upcoming Release Changes' }}
    # Temporary: same shared-config pin as stable (includes snapshot v3 fix)
    uses: ardatan/shared-config/.github/workflows/release-snapshot.yml@ea2edad4cafc039fde19d0c5705cd8db338d9c23
    with:
      npmTag: alpha
      buildScript: build
      node-version-file: .node-version
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
      npmToken: ${{ secrets.NODE_AUTH_TOKEN }}

  release-candidate:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if:
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.title == 'Upcoming Release Changes' }}
    # Temporary: same shared-config pin as stable (includes snapshot v3 fix)
    uses: ardatan/shared-config/.github/workflows/release-snapshot.yml@ea2edad4cafc039fde19d0c5705cd8db338d9c23
    with:
      npmTag: rc
      buildScript: build
      node-version-file: .node-version
      restoreDeletedChangesets: true
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
      npmToken: ${{ secrets.NODE_AUTH_TOKEN }}
