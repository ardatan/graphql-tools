name: notify-website

# The docs at the-guild.dev/graphql/tools are built by the-guild-org/website,
# which fetches this repo's website/ folder at build time. Tell it to
# redeploy whenever that content changes.
on:
  push:
    branches:
      - master
    paths:
      - website/**

# The dispatch uses a PAT, so the workflow token needs no permissions at all.
permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: trigger website rebuild
        env:
          # Fine-grained PAT for the-guild-org/website with contents:write
          # (repository_dispatch permission).
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/the-guild-org/website/dispatches \
            -d '{"event_type":"product-content-update","client_payload":{"product":"tools"}}'
